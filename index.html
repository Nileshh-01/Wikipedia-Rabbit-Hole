<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <!-- start -->
        <div id="startPoint" class="cards">
            <div id="startText" class="Text">
                <div id="startTitle"></div>
                <div id="startDescript"></div>
            </div>
            <img src="">
            
        </div>

        <div id="gameMode">
            <div id="gameModeText">Select difficulty</div>
            <div id="difficulty">
                <button id="easy" class="difficultyBtns">Easy</button>
                <button id="medium" class="difficultyBtns">Medium</button>
                <button id="hard" class="difficultyBtns">Hard</button>
            </div>
        </div>

        <div id="gameStatus">
            <div class="rabbitHole">Rabbit Hole depth: <span id="depth"></span></div>
            <div class="rabbitHole">Max Rabbit Hole depth <span id="maxDepth"></span></div>
            <button id="restart">Restart Game</button>
        </div>

        <div id="lostPopup">
            <div id="lostBox">
                <h2>You Lost</h2>
                <p>You reached the maximum rabbit hole depth.</p>
                <button id="restartLost">Restart Game</button>
            </div>
        </div>

        <div id="wonPopup">
            <div id="wonBox">
                <h2>You Lost</h2>
                <p>You reached the maximum rabbit hole depth.</p>
                <button id="restartWon">Restart Game</button>
            </div>
        </div>

        <!-- curr -->
        <div id="curr" class="cards">
            <img src="">
            <div id="currText" class="Text">
                <div id="currTitle"></div>
                <div id="currDescript"></div>
            </div>
            <button id="relLinks">Related Links</button>
            <div id="currRelLinks"></div>

        </div>

        
        <!-- end -->
        <div id="endPoint" class="cards">
            <div id="endText" class="Text">
                <div id="endTitle"></div>
                <div id="endDescript"></div>
            </div>
            
            <img src="">
        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
